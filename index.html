<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IHS Player - Ana Menü</title>
    <style>
        :root {
            --bg-color: #0b0e14;
            --surface-color: #161b26;
            --primary-color: #0066ff;
            --text-primary: #ffffff;
            --text-secondary: #8a93a2;
            --focus-ring: 4px solid #ffffff;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden; /* TV ekranlarında sayfa kaydırması istenmez */
            display: flex;
            height: 100vh;
        }

        /* Sol Navigasyon Menüsü */
        nav {
            width: 280px;
            background-color: var(--surface-color);
            padding: 50px 0;
            display: flex;
            flex-direction: column;
            box-shadow: 10px 0 20px rgba(0,0,0,0.5);
            z-index: 10;
        }

        .brand {
            font-size: 32px;
            font-weight: 800;
            text-align: center;
            margin-bottom: 60px;
            color: var(--primary-color);
            letter-spacing: 2px;
        }

        .nav-item {
            padding: 22px 40px;
            font-size: 22px;
            color: var(--text-secondary);
            text-decoration: none;
            display: block;
            transition: all 0.2s ease;
            outline: none; 
            border-left: 6px solid transparent;
        }

        /* Kumanda Odaklanma (Focus) Tasarımı */
        .nav-item:focus, .nav-item.active {
            background-color: rgba(0, 102, 255, 0.1);
            color: var(--text-primary);
            border-left: 6px solid var(--primary-color);
            transform: scale(1.05);
            font-weight: 600;
        }

        /* Ana İçerik Alanı */
        main {
            flex: 1;
            padding: 60px;
            display: flex;
            flex-direction: column;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 42px;
            margin: 0;
            font-weight: 700;
        }

        .time {
            font-size: 28px;
            color: var(--text-secondary);
            font-weight: 300;
        }

        /* Grid Yapısı */
        .content-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 30px;
            overflow-y: auto;
            padding-right: 20px;
            padding-bottom: 50px;
        }

        .card {
            background-color: var(--surface-color);
            border-radius: 16px;
            height: 220px;
            display: flex;
            align-items: flex-end;
            padding: 25px;
            background-size: cover;
            background-position: center;
            transition: transform 0.2s, box-shadow 0.2s, border 0.2s;
            outline: none;
            border: 4px solid transparent;
            cursor: pointer;
            position: relative;
        }

        /* Kart Görsel Örnekleri (Karanlık Gradient) */
        .card:nth-child(1) { background: linear-gradient(to top, rgba(11,14,20,1), transparent), #232b3d; }
        .card:nth-child(2) { background: linear-gradient(to top, rgba(11,14,20,1), transparent), #2a203b; }
        .card:nth-child(3) { background: linear-gradient(to top, rgba(11,14,20,1), transparent), #1e2e2d; }
        .card:nth-child(4) { background: linear-gradient(to top, rgba(11,14,20,1), transparent), #3d2323; }
        
        .card:focus {
            transform: scale(1.08);
            border: var(--focus-ring);
            box-shadow: 0 15px 40px rgba(0,0,0,0.8);
            z-index: 2;
        }

        .card-title {
            font-size: 22px;
            font-weight: 600;
            text-shadow: 0 4px 6px rgba(0,0,0,0.9);
        }

        /* Bilgi Metni */
        .helper {
            margin-top: auto;
            color: var(--text-secondary);
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
    </style>
</head>
<body>

    <nav>
        <div class="brand">IHS PLAYER</div>
        <a href="#" class="nav-item active" tabindex="1">Canlı Yayınlar</a>
        <a href="#" class="nav-item" tabindex="2">Filmler (VOD)</a>
        <a href="#" class="nav-item" tabindex="3">Diziler</a>
        <a href="#" class="nav-item" tabindex="4">TV Rehberi (EPG)</a>
        <a href="#" class="nav-item" tabindex="5">Ayarlar</a>
    </nav>

    <main>
        <header>
            <h1>Öne Çıkanlar</h1>
            <div class="time" id="clock">--:--</div>
        </header>

        <div class="content-grid">
            <div class="card" tabindex="6">
                <div class="card-title">Ulusal Kanallar</div>
            </div>
            <div class="card" tabindex="7">
                <div class="card-title">Spor</div>
            </div>
            <div class="card" tabindex="8">
                <div class="card-title">Belgesel</div>
            </div>
            <div class="card" tabindex="9">
                <div class="card-title">Sinema Serisi</div>
            </div>
        </div>
        
        <div class="helper">
            D-Pad (Yön Tuşları) ile ekranda gezinebilirsiniz.
        </div>
    </main>

    <script>
        // Sağ üst köşedeki dijital saat entegrasyonu
        function updateTime() {
            const now = new Date();
            let hours = now.getHours().toString().padStart(2, '0');
            let minutes = now.getMinutes().toString().padStart(2, '0');
            document.getElementById('clock').innerText = `${hours}:${minutes}`;
        }
        setInterval(updateTime, 1000);
        updateTime();

        // Kumanda Navigasyonu (Spatial Navigation) Yönetimi
        document.addEventListener('keydown', function(e) {
            const current = document.activeElement;
            const focusables = Array.from(document.querySelectorAll('[tabindex]'));
            let currentIndex = focusables.indexOf(current);

            if (e.key === 'ArrowDown') {
                e.preventDefault();
                let next = focusables[currentIndex + 1];
                if (next) next.focus();
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                let prev = focusables[currentIndex - 1];
                if (prev) prev.focus();
            } else if (e.key === 'ArrowRight') {
                // Menüden Grid içeriğine geçiş
                if (current.classList.contains('nav-item')) {
                    e.preventDefault();
                    document.querySelector('.card').focus();
                }
            } else if (e.key === 'ArrowLeft') {
                // İçerikten tekrar sol menüye dönüş
                if (current.classList.contains('card')) {
                    e.preventDefault();
                    document.querySelector('.nav-item.active').focus();
                }
            }
        });

        // Televizyon uygulaması açıldığında ana menüye odaklan
        window.onload = () => {
            document.querySelector('.nav-item').focus();
        };
    </script>
</body>
</html>
